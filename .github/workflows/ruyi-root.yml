name: iOS 16 root image (HFS+)

# Build the HFS+ root filesystem that XNU boots as rd=ufsroot0 / rd=md0.
#
# A GitHub runner has real root and the hfsplus kernel module, so it can mount
# and populate the image the way tools/mkiosroot.sh expects. Doing this on a
# workstation needs sudo; this workflow makes the artifact reproducible.
#
# Inputs are the three IPSW disk images and the two cryptexes, which are Apple
# material and must not be committed. They come from a previous run's artifact or
# from a URL supplied per dispatch.

on:
  workflow_dispatch:
    inputs:
      os_dmg_url:
        description: OS disk image URL (087-86698-044.dmg)
        required: false
        default: ""
      sysos_dmg_url:
        description: SystemOS cryptex URL (087-86593-047.dmg)
        required: false
        default: ""
      appos_dmg_url:
        description: AppOS cryptex URL (087-86715-047.dmg)
        required: false
        default: ""
      ipsw_url:
        description: IPSW URL to pull the three images from
        required: false
        default: ""
      size_gib:
        description: HFS+ image size in GiB
        required: false
        default: "16"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apfs-fuse hfsprogs rsync p7zip-full mtools python3
          sudo modprobe hfsplus || true
          ls /dev/loop* | head -3
          which apfs-fuse mkfs.hfsplus fsck.hfsplus rsync

      - name: Fetch the IPSW members
        run: |
          set -euo pipefail
          mkdir -p work/dmgs
          cd work/dmgs
          if [ -n "${{ inputs.ipsw_url }}" ]; then
            curl -fL --retry 3 -o restore.ipsw "${{ inputs.ipsw_url }}"
            unzip -o -q restore.ipsw "087-86698-044.dmg" "087-86593-047.dmg" "087-86715-047.dmg"
            rm -f restore.ipsw
          fi
          for pair in "os_dmg_url:087-86698-044.dmg" "sysos_dmg_url:087-86593-047.dmg" "appos_dmg_url:087-86715-047.dmg"; do
            key=${pair%%:*}; name=${pair##*:}
            url="$(python3 -c "import json,os;print(json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs'].get('$key') or '')")"
            [ -n "$url" ] && curl -fL --retry 3 -o "$name" "$url"
            printf '%-24s %s\n' "$name" "$(ls -l "$name" 2>/dev/null | awk '{print $5}' || echo MISSING)"
          done
          du -sh .

      - name: Build the HFS+ root
        run: |
          set -euo pipefail
          cd work
          bash ../tools/mkiosroot.sh dmgs/087-86698-044.dmg dmgs/087-86593-047.dmg \
               dmgs/087-86715-047.dmg ios16-root.img "${{ inputs.size_gib }}G" 2>&1 | tail -60
          ls -l ios16-root.img
          sudo chown "$USER:" ios16-root.img

      - name: Apply the bring-up changes
        run: |
          set -euo pipefail
          cd work
          mkdir -p mnt
          sudo mount -t hfsplus -o loop,force,rw ios16-root.img mnt
          sudo python3 ../tools/sweet-root-tweaks.py "$PWD/mnt" 2>&1 | tail -30 || true
          sudo umount mnt
          fsck.hfsplus -f -n ios16-root.img | tail -5 || true

      - name: Report the image
        run: |
          cd work
          ls -l ios16-root.img
          sha256sum ios16-root.img
          # img2simg keeps the fastboot sparse limit happy
          (command -v img2simg >/dev/null && img2simg ios16-root.img ios16-root.simg && ls -l ios16-root.simg) || echo "img2simg absent"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-root
          path: |
            work/ios16-root.img
            work/ios16-root.simg
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
